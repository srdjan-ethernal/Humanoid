<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Requirements before preferences</title><desc id="desc">A three-stage funnel narrows discovered candidates through requirements checks into trade-off comparison.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Requirements before preferences</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A strong shortlist is a filter, not a permanent leaderboard.</text><path d="M170 225H1030L900 330H300Z" fill="#29454a" stroke="#9caaa7"/><path d="M300 350H900L790 455H410Z" fill="#2e4d4b" stroke="#d7fa71"/><path d="M410 475H790L710 580H490Z" fill="#3a5549" stroke="#d7fa71"/><text x="600" y="286" fill="#edf2eb" font-size="25" text-anchor="middle">DISCOVER CANDIDATES</text><text x="600" y="410" fill="#d7fa71" font-size="24" text-anchor="middle">CHECK REQUIREMENTS</text><text x="600" y="535" fill="#d7fa71" font-size="22" text-anchor="middle">COMPARE TRADE-OFFS</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">13 / 01</text></g></svg>