<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Charging belongs in the floor plan</title><desc id="desc">A robot route leads to a labeled charging station with clear return and service access.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Charging belongs in the floor plan</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Plan the route, access and documented procedure together.</text><rect x="80" y="220" width="1040" height="365" rx="15" fill="#11272e" stroke="#344b50"/><rect x="850" y="295" width="190" height="190" rx="14" fill="#25434a" stroke="#d7fa71"/><text x="945" y="355" fill="#d7fa71" font-size="22" text-anchor="middle">CHARGE</text><rect x="915" y="390" width="60" height="45" rx="4" fill="#14292f" stroke="#d7fa71"/><rect x="975" y="403" width="9" height="18" rx="0" fill="#d7fa71" stroke="#d7fa71"/><g transform="translate(300 360) scale(0.55)"><rect x="-30" y="-120" width="60" height="52" rx="15" fill="#263f42" stroke="#d7fa71"/><path d="M-15 -95L15 -95" fill="none" stroke="#d7fa71" stroke-width="4" /><rect x="-55" y="-55" width="110" height="105" rx="20" fill="#243b40" stroke="#d7fa71"/><path d="M-66 -35L-100 40" fill="none" stroke="#d7fa71" stroke-width="17" /><path d="M66 -35L100 40" fill="none" stroke="#d7fa71" stroke-width="17" /><path d="M-28 62L-38 155" fill="none" stroke="#d7fa71" stroke-width="21" /><path d="M28 62L38 155" fill="none" stroke="#d7fa71" stroke-width="21" /><circle cx="-28" cy="62" r="8" fill="#edf2eb"/><circle cx="28" cy="62" r="8" fill="#edf2eb"/></g><path d="M400 450H720V390H820" fill="none" stroke="#79bdd0" stroke-width="5" stroke-dasharray="13 9"/><text x="550" y="325" fill="#79bdd0" font-size="24" text-anchor="start">Keep access clear</text><rect x="495" y="510" width="162" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="510" y="536" fill="#d7fa71" font-size="18" text-anchor="start">Return route</text><text x="945" y="545" fill="#9caaa7" font-size="20" text-anchor="middle">Service access</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">12 / 02</text></g></svg>