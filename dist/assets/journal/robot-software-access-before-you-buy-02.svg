<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Trace a change and its recovery</title><desc id="desc">A baseline-change-validation sequence includes a dashed recovery path returning to the saved baseline.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Trace a change and its recovery</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A successful example is only the first part of development.</text><rect x="80" y="270" width="280" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="104" y="308" fill="#d7fa71" font-size="17" text-anchor="start">BASELINE</text><text x="104" y="354" fill="#edf2eb" font-size="27" text-anchor="start">Known version</text><text x="104" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Save environment + settings</text><path d="M375 360L435 360" fill="none" stroke="#d7fa71" stroke-width="3" /><path d="M425 353L435 360L425 367" fill="none" stroke="#d7fa71" stroke-width="3"/><rect x="450" y="270" width="280" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="474" y="308" fill="#d7fa71" font-size="17" text-anchor="start">CHANGE</text><text x="474" y="354" fill="#edf2eb" font-size="27" text-anchor="start">Controlled update</text><text x="474" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Check one supported example</text><path d="M745 360L805 360" fill="none" stroke="#d7fa71" stroke-width="3" /><path d="M795 353L805 360L795 367" fill="none" stroke="#d7fa71" stroke-width="3"/><rect x="820" y="270" width="300" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="844" y="308" fill="#d7fa71" font-size="17" text-anchor="start">VALIDATE</text><text x="844" y="354" fill="#edf2eb" font-size="27" text-anchor="start">Verified result</text><text x="844" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Compare outputs + logs</text><path d="M970 470V550H220V470" fill="none" stroke="#79bdd0" stroke-width="3" stroke-dasharray="10 7"/><text x="600" y="590" fill="#79bdd0" font-size="23" text-anchor="middle">Document the supported recovery route before the update.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">08 / 02</text></g></svg>