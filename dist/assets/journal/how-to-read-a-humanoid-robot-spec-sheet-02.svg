<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Attach conditions to every number</title><desc id="desc">A central specification node connects to model revision, test workload, measurement method and source date.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Attach conditions to every number</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A specification is a claim with a configuration and a test context.</text><circle cx="600" cy="385" r="110" fill="#20383d"/><text x="600" y="380" fill="#d7fa71" font-size="24" text-anchor="middle">SPECIFICATION</text><text x="600" y="414" fill="#edf2eb" font-size="21" text-anchor="middle">+ evidence</text><path d="M420 282L500 385" fill="none" stroke="#9caaa7" stroke-width="2" /><rect x="190" y="260" width="240" height="70" rx="18" fill="#172c32" stroke="#344b50"/><text x="310" y="303" fill="#edf2eb" font-size="20" text-anchor="middle">Model / revision</text><path d="M835 282L700 385" fill="none" stroke="#9caaa7" stroke-width="2" /><rect x="835" y="260" width="240" height="70" rx="18" fill="#172c32" stroke="#344b50"/><text x="955" y="303" fill="#edf2eb" font-size="20" text-anchor="middle">Test workload</text><path d="M420 512L500 385" fill="none" stroke="#9caaa7" stroke-width="2" /><rect x="190" y="490" width="240" height="70" rx="18" fill="#172c32" stroke="#344b50"/><text x="310" y="533" fill="#edf2eb" font-size="20" text-anchor="middle">Measurement method</text><path d="M835 512L700 385" fill="none" stroke="#9caaa7" stroke-width="2" /><rect x="835" y="490" width="240" height="70" rx="18" fill="#172c32" stroke="#344b50"/><text x="955" y="533" fill="#edf2eb" font-size="20" text-anchor="middle">Source / date</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">03 / 02</text></g></svg>