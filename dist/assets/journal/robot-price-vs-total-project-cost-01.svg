<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">The complete project budget</title><desc id="desc">Three equal-width budget bands show acquisition, integration and operation without implying numeric cost proportions.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">The complete project budget</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">An illustrative cost structure, not a price estimate.</text><rect x="100" y="215" width="1000" height="100" rx="12" fill="#253e40" stroke="#344b50"/><text x="130" y="253" fill="#d7fa71" font-size="18" text-anchor="start">ACQUISITION</text><text x="430" y="273" fill="#edf2eb" font-size="27" text-anchor="start">Robot + delivery + import</text><rect x="100" y="340" width="1000" height="100" rx="12" fill="#28414a" stroke="#344b50"/><text x="130" y="378" fill="#d7fa71" font-size="18" text-anchor="start">INTEGRATION</text><text x="430" y="398" fill="#edf2eb" font-size="27" text-anchor="start">Fixtures + engineering + training</text><rect x="100" y="465" width="1000" height="100" rx="12" fill="#2e3841" stroke="#344b50"/><text x="130" y="503" fill="#d7fa71" font-size="18" text-anchor="start">OPERATION</text><text x="430" y="523" fill="#edf2eb" font-size="27" text-anchor="start">Service + software + supervision</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">02 / 01</text></g></svg>