<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Survey the whole route</title><desc id="desc">A simple floor plan marks a dashed route between workstation and charging, with a doorway, turning space and floor transition.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Survey the whole route</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">The operating layout includes more than the destination.</text><rect x="80" y="205" width="1040" height="390" rx="10" fill="#12272d" stroke="#344b50"/><rect x="150" y="270" width="230" height="110" rx="5" fill="#2c4145" stroke="#344b50"/><text x="265" y="332" fill="#edf2eb" font-size="22" text-anchor="middle">Workstation</text><rect x="820" y="450" width="220" height="100" rx="5" fill="#2c4145" stroke="#344b50"/><text x="930" y="509" fill="#edf2eb" font-size="22" text-anchor="middle">Charging</text><path d="M260 435H600V300H980V420" stroke="#d7fa71" stroke-width="6" fill="none" stroke-dasharray="14 10"/><path d="M610 210L610 260" fill="none" stroke="#79bdd0" stroke-width="8" /><path d="M610 345L610 390" fill="none" stroke="#79bdd0" stroke-width="8" /><rect x="520" y="420" width="107" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="535" y="446" fill="#d7fa71" font-size="18" text-anchor="start">Doorway</text><rect x="840" y="240" width="173" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="855" y="266" fill="#d7fa71" font-size="18" text-anchor="start">Turning space</text><circle cx="450" cy="435" r="18" fill="#eba77b"/><text x="400" y="500" fill="#eba77b" font-size="18" text-anchor="start">Floor transition</text><circle cx="980" cy="365" r="18" fill="#79bdd0"/><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">04 / 02</text></g></svg>