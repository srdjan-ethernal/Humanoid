<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Look beyond the highlight</title><desc id="desc">Six explicitly illustrative attempts include completions, a miss and an assisted outcome rather than only highlights.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Look beyond the highlight</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Evaluate repeated attempts under representative variation.</text><rect x="70" y="260" width="160" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="150" y="300" fill="#9caaa7" font-size="17" text-anchor="middle">TRY 1</text><circle cx="150" cy="355" r="22" fill="#d7fa71"/><text x="150" y="414" fill="#edf2eb" font-size="18" text-anchor="middle">Complete</text><rect x="250" y="260" width="160" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="330" y="300" fill="#9caaa7" font-size="17" text-anchor="middle">TRY 2</text><circle cx="330" cy="355" r="22" fill="#d7fa71"/><text x="330" y="414" fill="#edf2eb" font-size="18" text-anchor="middle">Complete</text><rect x="430" y="260" width="160" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="510" y="300" fill="#9caaa7" font-size="17" text-anchor="middle">TRY 3</text><circle cx="510" cy="355" r="22" fill="#eba77b"/><text x="510" y="414" fill="#edf2eb" font-size="18" text-anchor="middle">Miss</text><rect x="610" y="260" width="160" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="690" y="300" fill="#9caaa7" font-size="17" text-anchor="middle">TRY 4</text><circle cx="690" cy="355" r="22" fill="#d7fa71"/><text x="690" y="414" fill="#edf2eb" font-size="18" text-anchor="middle">Complete</text><rect x="790" y="260" width="160" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="870" y="300" fill="#9caaa7" font-size="17" text-anchor="middle">TRY 5</text><circle cx="870" cy="355" r="22" fill="#79bdd0"/><text x="870" y="414" fill="#edf2eb" font-size="18" text-anchor="middle">Assisted</text><rect x="970" y="260" width="160" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="1050" y="300" fill="#9caaa7" font-size="17" text-anchor="middle">TRY 6</text><circle cx="1050" cy="355" r="22" fill="#d7fa71"/><text x="1050" y="414" fill="#edf2eb" font-size="18" text-anchor="middle">Complete</text><text x="600" y="520" fill="#edf2eb" font-size="23" text-anchor="middle">Illustrative sequence — record every attempt, including misses.</text><text x="600" y="570" fill="#9caaa7" font-size="21" text-anchor="middle">Include setup, intervention and recovery in the record.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">14 / 01</text></g></svg>