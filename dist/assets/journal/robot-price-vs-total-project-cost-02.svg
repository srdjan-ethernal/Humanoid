<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Compare the same scope</title><desc id="desc">An illustrative quote comparison table distinguishes included, optional and unconfirmed scope for two anonymous offers.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Compare the same scope</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A quote matrix reveals differences hidden by the headline price.</text><text x="80" y="225" fill="#9caaa7" font-size="18" text-anchor="start">LINE ITEM</text><text x="530" y="225" fill="#d7fa71" font-size="18" text-anchor="start">OFFER A</text><text x="850" y="225" fill="#79bdd0" font-size="18" text-anchor="start">OFFER B</text><path d="M80 250L1110 250" fill="none" stroke="#344b50" stroke-width="1" /><text x="80" y="298" fill="#edf2eb" font-size="24" text-anchor="start">Base configuration</text><text x="530" y="298" fill="#edf2eb" font-size="23" text-anchor="start">Included</text><text x="850" y="298" fill="#edf2eb" font-size="23" text-anchor="start">Included</text><path d="M80 330L1110 330" fill="none" stroke="#344b50" stroke-width="1" /><text x="80" y="378" fill="#edf2eb" font-size="24" text-anchor="start">Development access</text><text x="530" y="378" fill="#eba77b" font-size="23" text-anchor="start">Confirm</text><text x="850" y="378" fill="#edf2eb" font-size="23" text-anchor="start">Included</text><path d="M80 410L1110 410" fill="none" stroke="#344b50" stroke-width="1" /><text x="80" y="458" fill="#edf2eb" font-size="24" text-anchor="start">Training</text><text x="530" y="458" fill="#edf2eb" font-size="23" text-anchor="start">Optional</text><text x="850" y="458" fill="#eba77b" font-size="23" text-anchor="start">Confirm</text><path d="M80 490L1110 490" fill="none" stroke="#344b50" stroke-width="1" /><text x="80" y="538" fill="#edf2eb" font-size="24" text-anchor="start">Recurring support</text><text x="530" y="538" fill="#eba77b" font-size="23" text-anchor="start">Confirm</text><text x="850" y="538" fill="#edf2eb" font-size="23" text-anchor="start">Optional</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">02 / 02</text></g></svg>