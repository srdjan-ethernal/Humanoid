<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Payload needs a position</title><desc id="desc">Two schematic arms hold identical blocks at different horizontal reaches; no numeric capacity is asserted.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Payload needs a position</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">The same object can create a different joint load at a longer reach.</text><path d="M100 550L1100 550" fill="none" stroke="#9caaa7" stroke-width="2" /><circle cx="270" cy="490" r="22" fill="#79bdd0"/><path d="M270 490L270 320" fill="none" stroke="#79bdd0" stroke-width="20" /><path d="M270 320L510 320" fill="none" stroke="#d7fa71" stroke-width="16" /><rect x="480" y="280" width="60" height="70" rx="4" fill="#d7fa71" stroke="#344b50"/><path d="M270 250L510 250" fill="none" stroke="#9caaa7" stroke-width="2" stroke-dasharray="6 6"/><text x="390" y="230" fill="#d7fa71" font-size="18" text-anchor="middle">SHORTER REACH</text><circle cx="720" cy="490" r="22" fill="#79bdd0"/><path d="M720 490L720 320" fill="none" stroke="#79bdd0" stroke-width="20" /><path d="M720 320L1060 320" fill="none" stroke="#d7fa71" stroke-width="16" /><rect x="1030" y="280" width="60" height="70" rx="4" fill="#d7fa71" stroke="#344b50"/><path d="M720 250L1060 250" fill="none" stroke="#9caaa7" stroke-width="2" stroke-dasharray="6 6"/><text x="890" y="230" fill="#d7fa71" font-size="18" text-anchor="middle">LONGER REACH</text><text x="180" y="605" fill="#edf2eb" font-size="24" text-anchor="start">Ask for load, reach, motion and duration together.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">03 / 01</text></g></svg>