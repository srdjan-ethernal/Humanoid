<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Make the first milestone small</title><desc id="desc">Four milestone cards progress through assembly, configuration, example execution and a single controlled change.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Make the first milestone small</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A working baseline makes later experiments easier to diagnose.</text><rect x="70" y="270" width="250" height="190" rx="18" fill="#172c32" stroke="#344b50"/><text x="94" y="308" fill="#d7fa71" font-size="17" text-anchor="start">01</text><text x="94" y="354" fill="#edf2eb" font-size="27" text-anchor="start">ASSEMBLE</text><text x="94" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Document the build</text><rect x="350" y="270" width="250" height="190" rx="18" fill="#172c32" stroke="#344b50"/><text x="374" y="308" fill="#d7fa71" font-size="17" text-anchor="start">02</text><text x="374" y="354" fill="#edf2eb" font-size="27" text-anchor="start">CONFIGURE</text><text x="374" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Save known settings</text><rect x="630" y="270" width="250" height="190" rx="18" fill="#172c32" stroke="#344b50"/><text x="654" y="308" fill="#d7fa71" font-size="17" text-anchor="start">03</text><text x="654" y="354" fill="#edf2eb" font-size="27" text-anchor="start">RUN EXAMPLE</text><text x="654" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Record the result</text><rect x="910" y="270" width="250" height="190" rx="18" fill="#172c32" stroke="#344b50"/><text x="934" y="308" fill="#d7fa71" font-size="17" text-anchor="start">04</text><text x="934" y="354" fill="#edf2eb" font-size="27" text-anchor="start">CHANGE ONE THING</text><text x="934" y="390" fill="#9caaa7" font-size="18" text-anchor="start">Compare with baseline</text><path d="M195 510L1035 510" fill="none" stroke="#d7fa71" stroke-width="3" /><circle cx="195" cy="510" r="8" fill="#d7fa71"/><circle cx="475" cy="510" r="8" fill="#d7fa71"/><circle cx="755" cy="510" r="8" fill="#d7fa71"/><circle cx="1035" cy="510" r="8" fill="#d7fa71"/><text x="600" y="575" fill="#edf2eb" font-size="24" text-anchor="middle">A modest complete result beats an unfinished broad experiment.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">05 / 02</text></g></svg>