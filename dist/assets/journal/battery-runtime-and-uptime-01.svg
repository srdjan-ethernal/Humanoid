<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Runtime becomes an operating cycle</title><desc id="desc">An illustrative operating cycle separates work, waiting, charging, inspection and resumed work without numeric duration claims.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Runtime becomes an operating cycle</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Illustrative sequence; segment widths are not measured durations.</text><rect x="80" y="280" width="190" height="115" rx="8" fill="#d7fa71" stroke="#d7fa71"/><text x="175" y="347" fill="#102027" font-size="22" text-anchor="middle">WORK</text><rect x="290" y="280" width="190" height="115" rx="8" fill="#79bdd0" stroke="#79bdd0"/><text x="385" y="347" fill="#102027" font-size="22" text-anchor="middle">WAIT</text><rect x="500" y="280" width="190" height="115" rx="8" fill="#eba77b" stroke="#eba77b"/><text x="595" y="347" fill="#102027" font-size="22" text-anchor="middle">CHARGE</text><rect x="710" y="280" width="190" height="115" rx="8" fill="#9caaa7" stroke="#9caaa7"/><text x="805" y="347" fill="#102027" font-size="22" text-anchor="middle">CHECK</text><rect x="920" y="280" width="190" height="115" rx="8" fill="#d7fa71" stroke="#d7fa71"/><text x="1015" y="347" fill="#102027" font-size="22" text-anchor="middle">WORK</text><path d="M90 465L1090 465" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M90 455L90 475" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M300 455L300 475" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M510 455L510 475" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M720 455L720 475" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M930 455L930 475" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M1090 455L1090 475" fill="none" stroke="#9caaa7" stroke-width="2" /><text x="90" y="510" fill="#9caaa7" font-size="18" text-anchor="start">CYCLE START</text><text x="1090" y="510" fill="#9caaa7" font-size="18" text-anchor="end">REPEAT</text><text x="600" y="590" fill="#edf2eb" font-size="25" text-anchor="middle">Productive time and available time are different measures.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">12 / 01</text></g></svg>