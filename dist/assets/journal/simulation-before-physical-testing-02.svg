<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Challenge the assumptions</title><desc id="desc">Four unscaled parameter ranges for contact, mass, friction and latency encourage sensitivity testing.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Challenge the assumptions</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Conceptual sensitivity map; no measured performance is implied.</text><text x="110" y="275" fill="#edf2eb" font-size="23" text-anchor="start">Contact</text><path d="M330 267L1040 267" fill="none" stroke="#3b5157" stroke-width="5" /><rect x="440" y="248" width="270" height="38" rx="18" fill="#28434a" stroke="#d7fa71"/><circle cx="560" cy="267" r="10" fill="#d7fa71"/><text x="110" y="357" fill="#edf2eb" font-size="23" text-anchor="start">Mass</text><path d="M330 349L1040 349" fill="none" stroke="#3b5157" stroke-width="5" /><rect x="515" y="330" width="245" height="38" rx="18" fill="#28434a" stroke="#d7fa71"/><circle cx="620" cy="349" r="10" fill="#d7fa71"/><text x="110" y="439" fill="#edf2eb" font-size="23" text-anchor="start">Friction</text><path d="M330 431L1040 431" fill="none" stroke="#3b5157" stroke-width="5" /><rect x="590" y="412" width="220" height="38" rx="18" fill="#28434a" stroke="#d7fa71"/><circle cx="680" cy="431" r="10" fill="#d7fa71"/><text x="110" y="521" fill="#edf2eb" font-size="23" text-anchor="start">Latency</text><path d="M330 513L1040 513" fill="none" stroke="#3b5157" stroke-width="5" /><rect x="665" y="494" width="195" height="38" rx="18" fill="#28434a" stroke="#d7fa71"/><circle cx="740" cy="513" r="10" fill="#d7fa71"/><text x="330" y="600" fill="#9caaa7" font-size="22" text-anchor="start">Vary one parameter and record how the outcome changes.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">09 / 02</text></g></svg>