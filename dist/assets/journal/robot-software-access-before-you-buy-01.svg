ext><text x="280" y="574" fill="#edf2eb" font-size="21" text-anchor="start">Exact edition and firmware</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">08 / 01</text></g></svg>