<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Put a boundary around the pilot</title><desc id="desc">A clear pilot boundary encloses one workflow, known objects, location, hours and owner; other sites and fleet rollout sit outside.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Put a boundary around the pilot</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A bounded trial produces an interpretable result.</text><rect x="95" y="220" width="1010" height="355" rx="18" fill="#11272e" stroke="#344b50"/><rect x="160" y="275" width="600" height="245" rx="18" fill="#243c40" stroke="#d7fa71"/><text x="190" y="320" fill="#d7fa71" font-size="19" text-anchor="start">IN SCOPE</text><text x="190" y="375" fill="#edf2eb" font-size="29" text-anchor="start">One workflow</text><text x="190" y="420" fill="#edf2eb" font-size="24" text-anchor="start">Known objects + defined location</text><text x="190" y="465" fill="#edf2eb" font-size="24" text-anchor="start">Agreed hours + named owner</text><text x="820" y="320" fill="#9caaa7" font-size="18" text-anchor="start">OUTSIDE SCOPE</text><text x="820" y="375" fill="#9caaa7" font-size="23" text-anchor="start">Other sites</text><text x="820" y="420" fill="#9caaa7" font-size="23" text-anchor="start">New tasks</text><text x="820" y="465" fill="#9caaa7" font-size="23" text-anchor="start">Fleet rollout</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">11 / 01</text></g></svg>