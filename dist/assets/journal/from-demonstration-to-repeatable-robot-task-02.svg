<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Frame the whole experiment</title><desc id="desc">A central visible-action frame is surrounded by before-stage setup and calibration and after-stage reset and recovery.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Frame the whole experiment</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">The visible action occupies only part of the workflow.</text><rect x="90" y="240" width="1020" height="330" rx="15" fill="#12292f" stroke="#344b50"/><rect x="390" y="295" width="420" height="200" rx="15" fill="#2b4547" stroke="#d7fa71"/><text x="600" y="375" fill="#d7fa71" font-size="26" text-anchor="middle">VISIBLE ACTION</text><text x="600" y="424" fill="#edf2eb" font-size="22" text-anchor="middle">What the demo shows</text><text x="225" y="335" fill="#79bdd0" font-size="23" text-anchor="middle">Before</text><text x="225" y="385" fill="#9caaa7" font-size="21" text-anchor="middle">Setup</text><text x="225" y="425" fill="#9caaa7" font-size="21" text-anchor="middle">Calibration</text><text x="965" y="335" fill="#79bdd0" font-size="23" text-anchor="middle">After</text><text x="965" y="385" fill="#9caaa7" font-size="21" text-anchor="middle">Reset</text><text x="965" y="425" fill="#9caaa7" font-size="21" text-anchor="middle">Recovery</text><path d="M300 465L375 465" fill="none" stroke="#79bdd0" stroke-width="3" /><path d="M365 458L375 465L365 472" fill="none" stroke="#79bdd0" stroke-width="3"/><path d="M825 465L900 465" fill="none" stroke="#79bdd0" stroke-width="3" /><path d="M890 458L900 465L890 472" fill="none" stroke="#79bdd0" stroke-width="3"/><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">14 / 02</text></g></svg>