<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Count the work around the action</title><desc id="desc">A three-row intervention ledger records work before, during and after a task, including responsibility.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Count the work around the action</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">An intervention log needs both time and cause.</text><text x="90" y="235" fill="#d7fa71" font-size="18" text-anchor="start">STAGE</text><text x="430" y="235" fill="#d7fa71" font-size="18" text-anchor="start">WHAT TO RECORD</text><text x="930" y="235" fill="#d7fa71" font-size="18" text-anchor="start">OWNER</text><path d="M90 265L1110 265" fill="none" stroke="#344b50" stroke-width="1" /><text x="90" y="322" fill="#edf2eb" font-size="24" text-anchor="start">Before task</text><text x="430" y="322" fill="#edf2eb" font-size="22" text-anchor="start">Setup and calibration</text><text x="930" y="322" fill="#79bdd0" font-size="21" text-anchor="start">Local team</text><path d="M90 365L1110 365" fill="none" stroke="#344b50" stroke-width="1" /><text x="90" y="422" fill="#edf2eb" font-size="24" text-anchor="start">During task</text><text x="430" y="422" fill="#edf2eb" font-size="22" text-anchor="start">Help request and duration</text><text x="930" y="422" fill="#79bdd0" font-size="21" text-anchor="start">Operator</text><path d="M90 465L1110 465" fill="none" stroke="#344b50" stroke-width="1" /><text x="90" y="522" fill="#edf2eb" font-size="24" text-anchor="start">After task</text><text x="430" y="522" fill="#edf2eb" font-size="22" text-anchor="start">Reset and recovery</text><text x="930" y="522" fill="#79bdd0" font-size="21" text-anchor="start">Support</text><rect x="270" y="585" width="129" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="285" y="611" fill="#d7fa71" font-size="18" text-anchor="start">Frequency</text><rect x="510" y="585" width="118" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="525" y="611" fill="#d7fa71" font-size="18" text-anchor="start">Duration</text><rect x="750" y="585" width="100" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="765" y="611" fill="#d7fa71" font-size="18" text-anchor="start">Cause</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">10 / 02</text></g></svg>