<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Make the shortlist earn its place</title><desc id="desc">A three-step staircase rises from documentation through representative trial to configuration review.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Make the shortlist earn its place</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Evidence becomes stronger as the proposed commitment grows.</text><rect x="90" y="470" width="310" height="115" rx="12" fill="#1a3035" stroke="#344b50"/><text x="115" y="508" fill="#edf2eb" font-size="23" text-anchor="start">Documentation</text><text x="115" y="548" fill="#9caaa7" font-size="18" text-anchor="start">Identify the candidate</text><rect x="445" y="375" width="310" height="210" rx="12" fill="#1a3035" stroke="#344b50"/><text x="470" y="413" fill="#edf2eb" font-size="23" text-anchor="start">Representative trial</text><text x="470" y="453" fill="#9caaa7" font-size="18" text-anchor="start">Observe your own task</text><rect x="800" y="280" width="310" height="305" rx="12" fill="#1a3035" stroke="#344b50"/><text x="825" y="318" fill="#edf2eb" font-size="23" text-anchor="start">Configuration review</text><text x="825" y="358" fill="#9caaa7" font-size="18" text-anchor="start">Resolve the unknowns</text><text x="90" y="215" fill="#d7fa71" font-size="18" text-anchor="start">DISCOVER</text><text x="1090" y="215" fill="#d7fa71" font-size="18" text-anchor="end">DECIDE</text><path d="M230 210L960 210" fill="none" stroke="#d7fa71" stroke-width="3" /><path d="M950 203L960 210L950 217" fill="none" stroke="#d7fa71" stroke-width="3"/><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">01 / 02</text></g></svg>