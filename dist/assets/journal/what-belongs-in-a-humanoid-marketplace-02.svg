<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">An accountable listing has a trail</title><desc id="desc">A product listing anatomy panel lists exact configuration, category, commercial status, dated source and compatibility questions leading to a supplier conversation.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">An accountable listing has a trail</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Connect a product identity to evidence and a commercial path.</text><rect x="100" y="225" width="610" height="345" rx="18" fill="#172c32" stroke="#344b50"/><text x="135" y="275" fill="#d7fa71" font-size="22" text-anchor="start">EXACT MODEL + CONFIGURATION</text><path d="M135 300L675 300" fill="none" stroke="#42595f" stroke-width="1" /><text x="135" y="345" fill="#edf2eb" font-size="23" text-anchor="start">Category and intended purpose</text><text x="135" y="392" fill="#edf2eb" font-size="23" text-anchor="start">Price / quote / reservation status</text><text x="135" y="439" fill="#edf2eb" font-size="23" text-anchor="start">Official source + review date</text><text x="135" y="486" fill="#edf2eb" font-size="23" text-anchor="start">Compatibility questions</text><path d="M730 395L820 395" fill="none" stroke="#d7fa71" stroke-width="3" /><path d="M810 388L820 395L810 402" fill="none" stroke="#d7fa71" stroke-width="3"/><rect x="840" y="300" width="260" height="190" rx="18" fill="#172c32" stroke="#344b50"/><text x="970" y="355" fill="#d7fa71" font-size="20" text-anchor="middle">NEXT STEP</text><text x="970" y="403" fill="#edf2eb" font-size="23" text-anchor="middle">Inspect source</text><text x="970" y="445" fill="#edf2eb" font-size="23" text-anchor="middle">Ask the supplier</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">15 / 02</text></g></svg>