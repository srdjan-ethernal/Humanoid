<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Describe the joint over time</title><desc id="desc">An unscaled step plot shows conceptual acceleration, holding, rest and movement phases over time.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Describe the joint over time</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Conceptual duty-cycle sketch; values are deliberately unscaled.</text><path d="M120 540L1090 540" fill="none" stroke="#9caaa7" stroke-width="2" /><path d="M120 230L120 540" fill="none" stroke="#9caaa7" stroke-width="2" /><text x="70" y="220" fill="#9caaa7" font-size="17" text-anchor="start">LOAD</text><text x="1090" y="580" fill="#9caaa7" font-size="17" text-anchor="end">TIME</text><path d="M125 470H250V285H380V365H640V475H790V310H930V470H1080" fill="none" stroke="#d7fa71" stroke-width="5"/><text x="260" y="260" fill="#d7fa71" font-size="19" text-anchor="start">Accelerate</text><text x="490" y="345" fill="#d7fa71" font-size="19" text-anchor="start">Hold</text><text x="700" y="450" fill="#d7fa71" font-size="19" text-anchor="start">Rest</text><text x="825" y="285" fill="#d7fa71" font-size="19" text-anchor="start">Move</text><rect x="240" y="595" width="100" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="255" y="621" fill="#d7fa71" font-size="18" text-anchor="start">Speed</text><rect x="440" y="595" width="118" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="455" y="621" fill="#d7fa71" font-siz