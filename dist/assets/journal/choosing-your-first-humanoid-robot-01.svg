<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Start with the work</title><desc id="desc">Three linked panels connect input object, workflow and finished result, with lighting, surfaces, exceptions and frequency below.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Start with the work</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Define the complete workflow before choosing a platform.</text><rect x="60" y="235" width="250" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="84" y="273" fill="#d7fa71" font-size="17" text-anchor="start">01 / INPUT</text><text x="84" y="319" fill="#edf2eb" font-size="27" text-anchor="start">Object</text><text x="84" y="355" fill="#9caaa7" font-size="18" text-anchor="start">What arrives?</text><path d="M325 325L395 325" fill="none" stroke="#d7fa71" stroke-width="3" /><path d="M385 318L395 325L385 332" fill="none" stroke="#d7fa71" stroke-width="3"/><rect x="410" y="235" width="320" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="434" y="273" fill="#d7fa71" font-size="17" text-anchor="start">02 / WORKFLOW</text><text x="434" y="319" fill="#edf2eb" font-size="27" text-anchor="start">Action + setting</text><text x="434" y="355" fill="#9caaa7" font-size="18" text-anchor="start">Where must it happen?</text><path d="M745 325L815 325" fill="none" stroke="#d7fa71" stroke-width="3" /><path d="M805 318L815 325L805 332" fill="none" stroke="#d7fa71" stroke-width="3"/><rect x="830" y="235" width="310" height="180" rx="18" fill="#172c32" stroke="#344b50"/><text x="854" y="273" fill="#d7fa71" font-size="17" text-anchor="start">03 / OUTCOME</text><text x="854" y="319" fill="#edf2eb" font-size="27" text-anchor="start">Finished result</text><text x="854" y="355" fill="#9caaa7" font-size="18" text-anchor="start">What counts as done?</text><rect x="190" y="505" width="118" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="205" y="531" fill="#d7fa71" font-size="18" text-anchor="start">Lighting</text><rect x="400" y="505" width="118" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="415" y="531" fill="#d7fa71" font-size="18" text-anchor="start">Surfaces</text><rect x="620" y="505" width="140" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="635" y="531" fill="#d7fa71" font-size="18" text-anchor="start">Exceptions</text><rect x="860" y="505" width="129" height="38" rx="8" fill="#152a2e" stroke="#d7fa71"/><text x="875" y="531" fill="#d7fa71" font-size="18" text-anchor="start">Frequency</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">01 / 01</text></g></svg>