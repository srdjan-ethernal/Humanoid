<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Human involvement has stages</title><desc id="desc">Five workflow stages show an illustrative mix of human confirmation and automatic execution, explicitly labeled as an example.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Human involvement has stages</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">A workflow can combine automatic execution and human assistance.</text><rect x="65" y="255" width="205" height="90" rx="18" fill="#172c32" stroke="#344b50"/><text x="168" y="308" fill="#edf2eb" font-size="23" text-anchor="middle">Setup</text><path d="M168 350L168 430" fill="none" stroke="#79bdd0" stroke-width="3" /><circle cx="168" cy="455" r="18" fill="#79bdd0"/><text x="168" y="510" fill="#79bdd0" font-size="19" text-anchor="middle">Ask / confirm</text><rect x="290" y="255" width="205" height="90" rx="18" fill="#172c32" stroke="#344b50"/><text x="393" y="308" fill="#edf2eb" font-size="23" text-anchor="middle">Perception</text><path d="M393 350L393 430" fill="none" stroke="#79bdd0" stroke-width="3" /><circle cx="393" cy="455" r="18" fill="#79bdd0"/><text x="393" y="510" fill="#79bdd0" font-size="19" text-anchor="middle">Ask / confirm</text><rect x="515" y="255" width="205" height="90" rx="18" fill="#172c32" stroke="#344b50"/><text x="618" y="308" fill="#edf2eb" font-size="23" text-anchor="middle">Execution</text><path d="M618 350L618 430" fill="none" stroke="#d7fa71" stroke-width="3" /><circle cx="618" cy="455" r="18" fill="#d7fa71"/><text x="618" y="510" fill="#d7fa71" font-size="19" text-anchor="middle">Automatic</text><rect x="740" y="255" width="205" height="90" rx="18" fill="#172c32" stroke="#344b50"/><text x="843" y="308" fill="#edf2eb" font-size="23" text-anchor="middle">Exception</text><path d="M843 350L843 430" fill="none" stroke="#79bdd0" stroke-width="3" /><circle cx="843" cy="455" r="18" fill="#79bdd0"/><text x="843" y="510" fill="#79bdd0" font-size="19" text-anchor="middle">Ask / confirm</text><rect x="965" y="255" width="205" height="90" rx="18" fill="#172c32" stroke="#344b50"/><text x="1068" y="308" fill="#edf2eb" font-size="23" text-anchor="middle">Recovery</text><path d="M1068 350L1068 430" fill="none" stroke="#79bdd0" stroke-width="3" /><circle cx="1068" cy="455" r="18" fill="#79bdd0"/><text x="1068" y="510" fill="#79bdd0" font-size="19" text-anchor="middle">Ask / confirm</text><text x="600" y="595" fill="#9caaa7" font-size="21" text-anchor="middle">Illustrative assignment only — verify the actual operating model.</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">10 / 01</text></g></svg>