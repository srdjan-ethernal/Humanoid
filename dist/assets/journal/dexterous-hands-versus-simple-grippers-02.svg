<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Build an object test set</title><desc id="desc">Four panels illustrate shape, surface texture, starting pose and fragility with distinct test objects.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">Build an object test set</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Vary properties that matter in the real application.</text><rect x="70" y="230" width="250" height="345" rx="18" fill="#172c32" stroke="#344b50"/><text x="95" y="280" fill="#d7fa71" font-size="20" text-anchor="start">SHAPE</text><text x="95" y="535" fill="#9caaa7" font-size="18" text-anchor="start">Size + geometry</text><rect x="350" y="230" width="250" height="345" rx="18" fill="#172c32" stroke="#344b50"/><text x="375" y="280" fill="#d7fa71" font-size="20" text-anchor="start">SURFACE</text><text x="375" y="535" fill="#9caaa7" font-size="18" text-anchor="start">Friction + texture</text><rect x="630" y="230" width="250" height="345" rx="18" fill="#172c32" stroke="#344b50"/><text x="655" y="280" fill="#d7fa71" font-size="20" text-anchor="start">POSE</text><text x="655" y="535" fill="#9caaa7" font-size="18" text-anchor="start">Starting orientation</text><rect x="910" y="230" width="250" height="345" rx="18" fill="#172c32" stroke="#344b50"/><text x="935" y="280" fill="#d7fa71" font-size="20" text-anchor="start">FRAGILITY</text><text x="935" y="535" fill="#9caaa7" font-size="18" text-anchor="start">Acceptable contact</text><c