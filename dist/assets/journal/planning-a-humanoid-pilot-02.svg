<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A pilot should end in a decision</title><desc id="desc">A review node branches into continue, revise and stop, each with a distinct reason.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#244048" stroke-opacity=".28"/></pattern></defs><rect width="1200" height="700" fill="#0c1c23"/><rect width="1200" height="700" fill="url(#grid)"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="53" fill="#d7fa71" font-size="16" text-anchor="start">HUMANOID / FIELD NOTES</text><text x="60" y="112" fill="#edf2eb" font-size="37" text-anchor="start">A pilot should end in a decision</text><text x="60" y="150" fill="#9caaa7" font-size="21" text-anchor="start">Agree on the possible outcomes before the first trial.</text><rect x="420" y="230" width="360" height="100" rx="18" fill="#172c32" stroke="#344b50"/><text x="600" y="289" fill="#d7fa71" font-size="27" text-anchor="middle">Review the evidence</text><path d="M600 340L600 395" fill="none" stroke="#9caaa7" stroke-width="3" /><path d="M210 395L990 395" fill="none" stroke="#9caaa7" stroke-width="3" /><path d="M210 395L210 440" fill="none" stroke="#9caaa7" stroke-width="3" /><rect x="65" y="440" width="290" height="130" rx="18" fill="#172c32" stroke="#344b50"/><text x="210" y="490" fill="#d7fa71" font-size="29" text-anchor="middle">Continue</text><text x="210" y="535" fill="#9caaa7" font-size="21" text-anchor="middle">Threshold met</text><path d="M600 395L600 440" fill="none" stroke="#9caaa7" stroke-width="3" /><rect x="455" y="440" width="290" height="130" rx="18" fill="#172c32" stroke="#344b50"/><text x="600" y="490" fill="#79bdd0" font-size="29" text-anchor="middle">Revise</text><text x="600" y="535" fill="#9caaa7" font-size="21" text-anchor="middle">Specific gap</text><path d="M990 395L990 440" fill="none" stroke="#9caaa7" stroke-width="3" /><rect x="845" y="440" width="290" height="130" rx="18" fill="#172c32" stroke="#344b50"/><text x="990" y="490" fill="#eba77b" font-size="29" text-anchor="middle">Stop</text><text x="990" y="535" fill="#9caaa7" font-size="21" text-anchor="middle">Poor task fit</text><path d="M60 640L1140 640" fill="none" stroke="#344b50" stroke-width="1" /><text x="60" y="673" fill="#9caaa7" font-size="15" text-anchor="start">Original editorial illustration • HUMANOID</text><text x="1140" y="673" fill="#9caaa7" font-size="15" text-anchor="end">11 / 02</text></g></svg>